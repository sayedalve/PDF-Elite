name: Build Windows Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare frontend generated assets
        working-directory: frontend/editor
        run: |
          # Mirror local developer prebuild: write env and generate icons required by LocalIcon.tsx
          npx tsx scripts/setup-env.mts --desktop
          node scripts/generate-icons.js

      - name: Build Frontend
        working-directory: frontend
        run: npx vite build editor --mode desktop

      - name: Download Stirling PDF JAR
        shell: powershell
        run: |
          $jarUrl = "https://files.stirlingpdf.com/v2.14.2/Stirling-PDF-with-login.jar"
          $destDir = "frontend\editor\src-tauri\libs"
          $destFile = "$destDir\stirling-pdf-2.14.2.jar"
          
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          
          Write-Host "Downloading Stirling PDF 2.14.2 JAR..."
          Invoke-WebRequest -Uri $jarUrl -OutFile $destFile
          
          if (-not (Test-Path $destFile)) {
            Write-Error "Download failed: File does not exist at $destFile"
            exit 1
          }
          
          $size = (Get-Item $destFile).length
          Write-Host "Downloaded file size: $size bytes"
          
          if ($size -lt 300000000) {
            Write-Error "Download failed: File size is too small ($size bytes). Expected ~319MB."
            exit 1
          }
          
          Write-Host "Verifying JAR validity..."
          # Test if it's a valid JAR (ZIP format) by listing its contents
          jar tf $destFile | Select-Object -First 10
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Validation failed: File is not a valid JAR archive."
            exit 1
          }
          Write-Host "JAR downloaded and verified successfully."

      - name: Build Custom JRE
        shell: powershell
        run: |
          $jreDir = "frontend\editor\src-tauri\runtime\jre"
          if (Test-Path $jreDir) {
            Remove-Item -Path $jreDir -Recurse -Force
          }
          Write-Host "Creating bundled JRE..."
          jlink --add-modules java.base,java.desktop,java.naming,java.logging,java.xml,java.prefs --output $jreDir --compress 2 --strip-debug --no-header-files --no-man-pages
          
          # Fix permissions on Windows for JRE files (from .taskfiles/desktop.yml)
          Get-ChildItem -Path $jreDir -Recurse -File | ForEach-Object { 
            [System.IO.File]::SetAttributes($_.FullName, ([System.IO.File]::GetAttributes($_.FullName) -band -bnot [System.IO.FileAttributes]::ReadOnly))
          }

      - name: Build Tauri Application
        working-directory: frontend\editor\src-tauri
        run: npx tauri build --verbose

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-application-build
          path: |
            frontend\editor\src-tauri\target\release\bundle\msi\*.msi
            frontend\editor\src-tauri\target\release\PDF Elite.exe
          if-no-files-found: error
