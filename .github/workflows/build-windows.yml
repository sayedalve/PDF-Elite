name: Build PDF Elite Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Download Stirling PDF JAR
        shell: pwsh
        run: |
          $libs = "frontend/editor/src-tauri/libs"
          $jar = "$libs/stirling-pdf-2.14.2.jar"

          New-Item -ItemType Directory -Force -Path $libs | Out-Null

          Write-Host "Downloading Stirling PDF..."
          
          Invoke-WebRequest `
            -Uri "https://sourceforge.net/projects/stirling-pdf/files/v2.14.2/Stirling-PDF.jar/download" `
            -OutFile $jar `
            -UseBasicParsing

          if (!(Test-Path $jar)) {
            throw "Stirling PDF JAR was not downloaded."
          }

          $size = (Get-Item $jar).Length

          Write-Host "JAR downloaded successfully."
          Write-Host "Size: $size bytes"

      - name: Install frontend dependencies
        working-directory: frontend/editor
        run: npm ci

      - name: Build Tauri application
        working-directory: frontend/editor
        run: npm run tauri build

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Elite-Windows
          path: |
            frontend/editor/src-tauri/target/release/bundle/nsis/*.exe
            frontend/editor/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error