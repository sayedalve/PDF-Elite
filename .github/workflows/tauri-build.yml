name: Build Tauri Applications (Windows Only)

on:
  workflow_call:
    inputs:
      platform:
        description: "Platform to build (windows or windows-arm64)."
        required: false
        type: string
        default: "windows"
      sign:
        description: "Sign the bundles."
        required: false
        type: boolean
        default: true
      minimal:
        description: "Fast smoke build."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build (windows or windows-arm64)"
        required: true
        default: "windows"
        type: choice
        options:
          - windows
          - windows-arm64
      sign:
        description: "Sign the bundles."
        required: false
        default: true
        type: boolean
      minimal:
        description: "Fast smoke build."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  determine-matrix:
    if: ${{ vars.CI_PROFILE != 'lite' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Determine build matrix
        id: set-matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          WINDOWS='{"platform":"windows-latest","args":"--target x86_64-pc-windows-msvc","name":"windows-x86_64","jpdfium_platforms":"windows-x64","builds_provisioner":true}'
          WINDOWS_ARM64='{"platform":"windows-11-arm","args":"--target aarch64-pc-windows-msvc --bundles nsis","name":"windows-arm64","jpdfium_platforms":"none","builds_provisioner":false}'

          case "$PLATFORM" in
            windows-arm64) ENTRIES=("$WINDOWS_ARM64") ;;
            *)             ENTRIES=("$WINDOWS" "$WINDOWS_ARM64") ;;
          esac

          JOINED=$(IFS=','; echo "${ENTRIES[*]}")
          echo "matrix={\"include\":[$JOINED]}" >> $GITHUB_OUTPUT

  build:
    needs: determine-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    env:
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      SIGN_BUNDLE: ${{ inputs.sign && github.ref == 'refs/heads/main' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: frontend/editor/src-tauri
          shared-key: tauri-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: ${{ matrix.platform == 'windows-11-arm' && 'microsoft' || 'temurin' }}

      - name: Cache Gradle User Home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-jdk-25-

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Prepare desktop build
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_PUBLIC_URL: ${{ secrets.MAVEN_PUBLIC_URL }}
          DISABLE_ADDITIONAL_FEATURES: true
          JPDFIUM_PLATFORMS: ${{ matrix.jpdfium_platforms }}
        run: task desktop:prepare
        shell: bash

      - name: Build backend JAR
        working-directory: ${{ github.workspace }}
        env:
          DISABLE_ADDITIONAL_FEATURES: true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmd //c ".\\gradlew.bat clean bootJar -x test -x spotlessApply -x spotlessCheck -PnoSpotless -PjpdfiumPlatforms=${{ matrix.jpdfium_platforms }}"
          else
            ./gradlew clean bootJar -x test -x spotlessApply -x spotlessCheck -PnoSpotless -PjpdfiumPlatforms=${{ matrix.jpdfium_platforms }}
          fi

      - name: Copy backend JAR to Tauri libs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "frontend/editor/src-tauri/libs"
          $jarPath = Get-ChildItem -Path "app/core/build/libs/stirling-pdf-*.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($jarPath) {
              Copy-Item -Path $jarPath.FullName -Destination "frontend/editor/src-tauri/libs/" -Force
              Write-Host "Successfully copied JAR: $($jarPath.Name)"
          } else {
              Write-Warning "JAR file not found! Creating a dummy JAR to prevent Tauri build panic."
              New-Item -Path "frontend/editor/src-tauri/libs/dummy.jar" -ItemType File
          }

      - name: Build bundled JRE (jlink)
        shell: bash
        run: task desktop:jlink:runtime
        env:
          DISABLE_ADDITIONAL_FEATURES: true

      - name: Build Windows provisioner and thumbnail handler
        if: matrix.builds_provisioner == true
        working-directory: frontend
        shell: bash
        run: node editor/scripts/build-provisioner.mjs

      - name: Build frontend (desktop mode)
        shell: bash
        run: task frontend:build:desktop

      - name: Run Tauri/Cargo tests
        working-directory: frontend/editor/src-tauri
        run: cargo test --verbose
        shell: bash

      - name: Configure Windows code signing (Thumbprint)
        id: thumbprint
        if: ${{ inputs.sign && startsWith(matrix.platform, 'windows') && env.SM_API_KEY != '' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $thumbprint = (& smctl windows certcurrent -alias "${{ secrets.SM_KEYPAIR_ALIAS }}" | Select-String -Pattern "Thumbprint" | ForEach-Object { $_.Line.Split(':')[1].Trim() })
          echo "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - name: Inject certificate thumbprint into Tauri config
        if: ${{ inputs.sign && startsWith(matrix.platform, 'windows') && env.SM_API_KEY != '' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $configPath = "frontend/editor/src-tauri/tauri.conf.json"
          $content = Get-Content $configPath -Raw
          $thumbprint = "${{ steps.thumbprint.outputs.thumbprint }}"
          $content = $content -replace '\"certificateThumbprint\":\s*null', "`\"certificateThumbprint`\": `"$thumbprint`""
          Set-Content $configPath -Value $content -NoNewline

      - name: Build Tauri app (signed)
        if: env.SIGN_BUNDLE == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          projectPath: ./frontend/editor
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Build Tauri app (unsigned)
        if: env.SIGN_BUNDLE != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN: "0"
          CI: true
        with:
          projectPath: ./frontend/editor
          tauriScript: npx tauri
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Elite-${{ matrix.name }}
          path: |
            frontend/editor/src-tauri/target/release/bundle/**/*.exe
            frontend/editor/src-tauri/target/release/bundle/**/*.msi
            frontend/editor/src-tauri/target/release/bundle/**/*.nsis
          if-no-files-found: warn
